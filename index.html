        '<div class="est-note" style="margin-top:8px;">Est. ready dates are a range (rough heuristic from box temp/humidity/thickness) until a strip has at least one weigh-in, then it switches to a single date from its own measured drying rate.</div>' +
      '</div>') : '<div class="card"><div class="ing-empty">No strips yet — click "+ Add strip" below.</div></div>';

    var insightRows = sum.rows.map(function(r) {
      return '<div class="insight-row"><span class="strip-dot" style="background:' + seriesColor(r.idx) + ';margin-top:5px;"></span><span>' + generateInsight(r.strip, b, r.stats) + '</span></div>';
    }).join("");
    var insights = sum.total ? ('<div class="section-title">Drying insight</div><div class="card insight-list">' + insightRows + '</div>') : '';

    var chart = sum.total ? renderChart(b, sum) : "";
    var tempChart = renderEnvChart(b, "temp");
    var humChart = renderEnvChart(b, "hum");
    var chartControls = sum.total ? ('' +
      '<div class="chart-controls">' +
        '<label><input type="checkbox" id="toggleFitPerStrip"' + (chartShowPerStripFit ? ' checked' : '') + '> Modeled trend, per strip</label>' +
        '<label><input type="checkbox" id="toggleFitCombined"' + (chartShowCombinedFit ? ' checked' : '') + '> Modeled trend, combined (all strips)</label>' +
      '</div>') : '';

    var ingredientsList = (b.ingredients && b.ingredients.filter(function(i){ return i.name; }).length)
      ? '<ul class="ing-list">' + b.ingredients.filter(function(i){ return i.name; }).map(function(i){ return '<li><span>' + esc(i.name) + '</span><span class="amt">' + esc(i.amount || '') + '</span></li>'; }).join("") + '</ul>'
      : '<div class="ing-empty">No ingredients logged yet — click Edit to add your spice mix.</div>';

    var today = todayISO();
    var stripWeighRows = sum.rows.map(function(r) {
      var strip = r.strip, s = r.stats, color = seriesColor(r.idx);
      var lastWeight = s.hasEntries ? s.lastEntry.weightG : strip.initialWeightG;
      return '' +
      '<div class="strip-weigh-row">' +
        '<span class="swr-label"><span class="strip-dot" style="background:' + color + '"></span>' + esc(strip.label) + '</span>' +
        '<input class="swr-input" type="number" min="1" step="1" name="stripWeight_' + strip.id + '" placeholder="' + lastWeight + 'g">' +
        '<span class="swr-hint">last: ' + lastWeight + 'g</span>' +
      '</div>';
    }).join("");

    var dayLogs = dayLogsFor(b.id).slice().reverse();
    var envRows = dayLogs.map(function(l) {
      return '' +
      '<tr>' +
        '<td>' + fmtDate(l.date) + (l.time ? ', ' + fmtTime(l.time) : '') + '</td>' +
        '<td>' + (l.boxTempC !== "" && l.boxTempC != null ? l.boxTempC + '°C' : '—') + ' / ' + (l.boxHumidityPct !== "" && l.boxHumidityPct != null ? l.boxHumidityPct + '%' : '—') + '</td>' +
        '<td>' + (l.roomTempC !== "" && l.roomTempC != null ? l.roomTempC + '°C' : '—') + ' / ' + (l.roomHumidityPct !== "" && l.roomHumidityPct != null ? l.roomHumidityPct + '%' : '—') + '</td>' +
        '<td>' + (l.fanSpeed || '—') + '</td>' +
        '<td class="notes">' + esc(l.notes || '') + '</td>' +
        '<td class="row-actions"><button class="btn btn-ghost btn-sm" data-del-daylog="' + l.id + '" title="Delete">✕</button></td>' +
      '</tr>';
    }).join("");

    var weightLogRows = [];
    sum.rows.forEach(function(r) {
      r.stats.log.forEach(function(w) {
        var lossPct = ((r.strip.initialWeightG - w.weightG) / r.strip.initialWeightG) * 100;
        weightLogRows.push({ date: w.date, createdAt: w.createdAt, html: '' +
          '<tr>' +
            '<td>' + fmtDate(w.date) + (w.time ? ', ' + fmtTime(w.time) : '') + '</td>' +
            '<td><span class="strip-name-cell"><span class="strip-dot" style="background:' + seriesColor(r.idx) + '"></span>' + esc(r.strip.label) + '</span></td>' +
            '<td>' + w.weightG + 'g</td>' +
            '<td>' + lossPct.toFixed(1) + '%</td>' +
            '<td class="row-actions"><button class="btn btn-ghost btn-sm" data-del-stripweight="' + w.id + '" title="Delete">✕</button></td>' +
          '</tr>' });
      });
    });
    weightLogRows.sort(function(a,b2){ return b2.date.localeCompare(a.date) || b2.createdAt - a.createdAt; });

    var ratingStars = '<div class="rating-row">' +
      [1,2,3,4,5].map(function(n) {
        var filled = b.rating && n <= b.rating;
        return '<button type="button" class="star-btn" data-rate-batch="' + n + '" title="Rate ' + n + ' star' + (n === 1 ? "" : "s") + '" style="color:' + (filled ? "var(--accent)" : "var(--border)") + ';">★</button>';
      }).join("") +
      (b.rating ? '<button type="button" class="btn btn-ghost btn-sm" data-rate-batch="0" style="margin-left:4px;">clear</button><span class="hint" style="margin-left:2px;">Overall rating</span>' : '<span class="hint" style="margin-left:4px;">Rate this batch once you\'ve tried it</span>') +
    '</div>';

    return '' +
    '<div class="backrow"><button class="btn btn-ghost" id="btnBack">← All batches</button></div>' +
    '<div class="card">' +
      '<div class="detail-head">' +
        '<div><h2>' + esc(b.name) + '</h2><div class="meta">' + esc(metaBits) + '<br>Started ' + fmtDate(b.startDate) + '</div>' + ratingStars + '</div>' +
        '<div class="detail-actions"><button class="btn btn-sm" id="btnEditBatch">Edit details</button><button class="btn btn-sm btn-danger" id="btnDeleteBatch">Delete batch</button></div>' +
      '</div>' +
      summaryChips +
    '</div>' +

    '<div class="section-title">Strips<button class="btn btn-ghost btn-sm" id="btnAddStrip">+ Add strip</button></div>' +
    stripsTable +
    stripModal("add", b, null) +

    insights +

    (chart ? '<div class="section-title">Weight loss over time</div>' + chartControls + '<div class="card chart-card">' + chart + '</div>' : '') +

    (tempChart || humChart ? '<div class="section-title">Environment over time</div>' : '') +
    (tempChart ? '<div class="card chart-card" style="margin-bottom:12px;">' + tempChart + '</div>' : '') +
    (humChart ? '<div class="card chart-card">' + humChart + '</div>' : '') +

    '<div class="section-title">Marinade &amp; spice mix</div>' +
    '<div class="card">' + ingredientsList + (b.methodNotes ? '<div class="hint" style="margin-top:10px;">' + esc(b.methodNotes) + '</div>' : '') + '</div>' +
    batchModal("edit", b) +

    '<div class="section-title">Add today\'s update</div>' +
    '<div class="card add-entry-card">' +
      '<form id="entryForm">' +
        '<div class="field-row">' +
          '<div class="field"><label>Date</label><input type="date" name="date" value="' + today + '" max="' + today + '" required></div>' +
          '<div class="field"><label>Time</label><input type="time" name="time" value="' + nowTimeHHMM() + '"></div>' +
          '<div class="field"><label>Fan speed today</label><select name="fanSpeed"><option value="">—</option>' + FAN_SPEEDS.map(function(s2){ return '<option ' + (s2===(b.fanSpeed||"")?"selected":"") + '>' + s2 + '</option>'; }).join("") + '</select></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Box temp (°C)</label><input type="number" name="boxTempC" step="0.1" placeholder="e.g. 22"></div>' +
          '<div class="field"><label>Box humidity (%RH)</label><input type="number" name="boxHumidityPct" step="1" placeholder="e.g. 45"></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Room temp (°C)</label><input type="number" name="roomTempC" step="0.1" placeholder="optional"></div>' +
          '<div class="field"><label>Room humidity (%RH)</label><input type="number" name="roomHumidityPct" step="1" placeholder="optional"></div>' +
        '</div>' +
        (sum.total ? '<div class="field"><label>Strip weights today (leave blank to skip a strip)</label><div class="strip-weigh-list">' + stripWeighRows + '</div></div>' : '') +
        '<div class="field"><label>Notes</label><textarea name="notes" placeholder="Texture, smell, colour, anything unusual..."></textarea></div>' +
        '<div class="form-actions"><button type="submit" class="btn btn-primary">Save update</button></div>' +
      '</form>' +
    '</div>' +

    '<div class="section-title">Environment log</div>' +
    (dayLogs.length ? ('<div class="card" style="overflow-x:auto;">' +
      '<table class="data"><thead><tr><th>Date</th><th>Box T/RH</th><th>Room T/RH</th><th>Fan</th><th>Notes</th><th></th></tr></thead><tbody>' + envRows + '</tbody></table>' +
    '</div>') : '<div class="card"><div class="ing-empty">No readings logged yet.</div></div>') +

    '<div class="section-title">Strip weight log</div>' +
    (weightLogRows.length ? ('<div class="card" style="overflow-x:auto;">' +
      '<table class="data"><thead><tr><th>Date</th><th>Strip</th><th>Weight</th><th>Loss</th><th></th></tr></thead><tbody>' + weightLogRows.map(function(r){return r.html;}).join("") + '</tbody></table>' +
    '</div>') : '<div class="card"><div class="ing-empty">No weigh-ins logged yet.</div></div>');
  }

  function renderChart(b, sum) {
    var directLabel = sum.total <= 4;
    var W = 660, H = 260, padL = 42, padR = directLabel ? 132 : 20, padT = 16, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var maxDay = 1, maxPct = 20;
    sum.rows.forEach(function(r) {
      var d0 = daysBetween(b.startDate, r.strip.addedDate);
      if (d0 > maxDay) maxDay = d0;
      r.stats.log.forEach(function(w) {
        var d = daysBetween(b.startDate, w.date);
        var pct = ((r.strip.initialWeightG - w.weightG) / r.strip.initialWeightG) * 100;
        if (d > maxDay) maxDay = d;
        if (pct > maxPct) maxPct = pct;
      });
    });
    maxDay = Math.max(maxDay, 7); // always show at least a week, so the ideal profile reads in full
    var idealAtMaxDay = dryPctAtDay(maxDay, DRY_REFERENCE_K);
    maxPct = Math.ceil(Math.max(maxPct * 1.15, b.targetLossPct * 1.15, idealAtMaxDay * 1.05, 20) / 10) * 10;

    function x(day) { return padL + (day / maxDay) * plotW; }
    function y(pct) { return padT + plotH - (clamp(pct, 0, maxPct) / maxPct) * plotH; }

    var gridStep = maxPct / 4, gridLines = "";
    for (var g = 0; g <= 4; g++) {
      var val = g * gridStep, gy = y(val);
      gridLines += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--gridline)" stroke-width="1"></line>';
      gridLines += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10.5" fill="var(--muted)">' + Math.round(val) + '%</text>';
    }

    var targetY = y(b.targetLossPct);
    var targetLine = '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + targetY + '" y2="' + targetY + '" stroke="var(--text-primary)" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"></line>' +
      '<text x="' + (W - padR) + '" y="' + (targetY - 5) + '" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">Target ' + b.targetLossPct + '%</text>';

    function curvePath(startDay, k, dayOffset) {
      var steps = 24, d = "";
      for (var i = 0; i <= steps; i++) {
        var dBatch = startDay + (maxDay - startDay) * (i / steps);
        var pctAtD = dryPctAtDay(dBatch - dayOffset, k);
        d += (i === 0 ? "M" : "L") + x(dBatch).toFixed(1) + " " + y(pctAtD).toFixed(1) + " ";
      }
      return d.trim();
    }

    // Ideal/typical drying profile — the same calibrated curve (reference
    // conditions: ~20mm, 22°C, 45%RH, medium fan) that the per-strip and
    // combined trend lines are fit variants of, so they're always visually
    // comparable against this fixed baseline.
    var idealLine = '<path d="' + curvePath(0, DRY_REFERENCE_K, 0) + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="1 3" stroke-linecap="round"></path>';

    var linesSvg = "", fitSvg = "", markersSvg = "", labelsSvg = "", anyFit = false, allPts = [];
    sum.rows.forEach(function(r) {
      var color = seriesColor(r.idx);
      var d0 = daysBetween(b.startDate, r.strip.addedDate);
      var pts = [{ day: d0, pct: 0, w: { date: r.strip.addedDate, weightG: r.strip.initialWeightG }, isStart: true }];
      r.stats.log.forEach(function(w) {
        var d = daysBetween(b.startDate, w.date);
        var pct = ((r.strip.initialWeightG - w.weightG) / r.strip.initialWeightG) * 100;
        pts.push({ day: d, pct: pct, w: w });
      });
      allPts = allPts.concat(pts);
      var pathD = pts.map(function(p, i) { return (i === 0 ? "M" : "L") + x(p.day).toFixed(1) + " " + y(p.pct).toFixed(1); }).join(" ");
      linesSvg += '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
      // Modeled trend — the same decelerating drying curve driving the "est. ready"
      // date, not a straight line (drying slows over time, so a straight-line fit
      // would predict finishing too soon). Needs a couple of real weigh-ins.
      if (chartShowPerStripFit && r.stats.log.length >= 2 && r.stats.kEff) {
        anyFit = true;
        fitSvg += '<path d="' + curvePath(d0, r.stats.kEff, d0) + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="2 4"></path>';
      }
      pts.forEach(function(p) {
        var whenTxt = fmtDate(p.w.date) + (p.w.time ? ", " + fmtTime(p.w.time) : "");
        var title = p.isStart
          ? esc(r.strip.label) + " — " + whenTxt + " (day " + p.day + ") — starting weight " + p.w.weightG + "g"
          : esc(r.strip.label) + " — " + whenTxt + " (day " + p.day + ") — " + p.w.weightG + "g, " + p.pct.toFixed(1) + "% loss";
        markersSvg += '<circle cx="' + x(p.day).toFixed(1) + '" cy="' + y(p.pct).toFixed(1) + '" r="4" fill="' + color + '" stroke="var(--surface-1)" stroke-width="2" class="pt" data-tip="' + esc(title) + '"><title>' + title + '</title></circle>';
      });
      if (directLabel) {
        var lastPt = pts[pts.length - 1];
        labelsSvg += '<text x="' + (x(lastPt.day) + 7) + '" y="' + (y(lastPt.pct) + 3) + '" font-size="10.5" fill="' + color + '" font-weight="600">' + esc(r.strip.label) + '</text>';
      }
    });

    var anyCombinedFit = false;
    if (chartShowCombinedFit) {
      var combinedK = fitDryingK(allPts);
      if (combinedK) {
        anyCombinedFit = true;
        fitSvg += '<path d="' + curvePath(0, combinedK, 0) + '" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="6 3"></path>';
      }
    }

    var xAxisLabels = "", xTickCount = Math.min(maxDay, 6);
    for (var t = 0; t <= xTickCount; t++) {
      var dd = Math.round((t / xTickCount) * maxDay);
      xAxisLabels += '<text x="' + x(dd) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="var(--muted)">Day ' + dd + '</text>';
    }
    var baseline = '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '" stroke="var(--baseline)" stroke-width="1.5"></line>';

    var legend = '<div class="legend">' + sum.rows.map(function(r) {
      return '<span class="item"><span class="swatch" style="background:' + seriesColor(r.idx) + '"></span>' + esc(r.strip.label) + '</span>';
    }).join("") + '<span class="item"><span class="swatch dashed"></span>Target</span>' +
      '<span class="item"><span class="swatch dashed" style="background:none;border-top:1.5px dotted var(--muted);height:0;"></span>Ideal profile</span>' +
      (anyFit ? '<span class="item"><span class="swatch dashed"></span>Modeled trend</span>' : '') +
      (anyCombinedFit ? '<span class="item"><span class="swatch dashed" style="background:none;border-top:2px dashed var(--text-primary);height:0;"></span>Combined modeled trend</span>' : '') + '</div>';

    return '' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;" role="img" aria-label="Weight loss percentage over time by strip">' +
      gridLines + baseline + targetLine + idealLine + fitSvg + linesSvg + markersSvg + labelsSvg + xAxisLabels +
    '</svg>' + legend;
  }

  // Temp (°C) and humidity (%RH) are different scales, so this renders one or the
  // other as its own single-axis chart — never both on one dual-axis plot, which
  // is misleading (the #1 charting mistake: two y-scales invites false correlation).
  function renderEnvChart(b, kind) {
    var boxField = kind === "temp" ? "boxTempC" : "boxHumidityPct";
    var roomField = kind === "temp" ? "roomTempC" : "roomHumidityPct";
    var unit = kind === "temp" ? "°C" : "%";
    var label = kind === "temp" ? "Temperature" : "Humidity";

    var logs = dayLogsFor(b.id);
    var boxPts = [], roomPts = [];
    logs.forEach(function(l) {
      var d = daysBetween(b.startDate, l.date);
      if (l[boxField] !== "" && l[boxField] != null) boxPts.push({ day: d, val: Number(l[boxField]), date: l.date, time: l.time });
      if (l[roomField] !== "" && l[roomField] != null) roomPts.push({ day: d, val: Number(l[roomField]), date: l.date, time: l.time });
    });
    if (boxPts.length === 0 && roomPts.length === 0) return "";

    var W = 660, H = 200, padL = 42, padR = 20, padT = 16, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var allPts = boxPts.concat(roomPts);
    var maxDay = 1, minVal = Infinity, maxVal = -Infinity;
    allPts.forEach(function(p) {
      if (p.day > maxDay) maxDay = p.day;
      if (p.val < minVal) minVal = p.val;
      if (p.val > maxVal) maxVal = p.val;
    });
    if (minVal === maxVal) { minVal -= 1; maxVal += 1; }
    var vPad = (maxVal - minVal) * 0.15 || 1;
    minVal -= vPad; maxVal += vPad;

    function x(day) { return padL + (day / maxDay) * plotW; }
    function y(val) { return padT + plotH - ((val - minVal) / (maxVal - minVal)) * plotH; }

    var gridLines = "", gridStep = (maxVal - minVal) / 4;
    for (var g = 0; g <= 4; g++) {
      var gval = minVal + g * gridStep, gy = y(gval);
      gridLines += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--gridline)" stroke-width="1"></line>';
      gridLines += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10.5" fill="var(--muted)">' + Math.round(gval) + unit + '</text>';
    }
    var baseline = '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '" stroke="var(--baseline)" stroke-width="1.5"></line>';

    function seriesSvg(pts, color, seriesLabel) {
      if (!pts.length) return "";
      var sorted = pts.slice().sort(function(a, c) { return a.day - c.day; });
      var pathD = sorted.map(function(p, i) { return (i === 0 ? "M" : "L") + x(p.day).toFixed(1) + " " + y(p.val).toFixed(1); }).join(" ");
      var svg = '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
      sorted.forEach(function(p) {
        var title = seriesLabel + " — " + fmtDate(p.date) + (p.time ? ", " + fmtTime(p.time) : "") + " (day " + p.day + ") — " + p.val + unit;
        svg += '<circle cx="' + x(p.day).toFixed(1) + '" cy="' + y(p.val).toFixed(1) + '" r="4" fill="' + color + '" stroke="var(--surface-1)" stroke-width="2" class="pt" data-tip="' + esc(title) + '"><title>' + esc(title) + '</title></circle>';
      });
      return svg;
    }

    var boxColor = "var(--series-1)", roomColor = "var(--series-2)";
    var seriesSvgStr = seriesSvg(boxPts, boxColor, "Box") + seriesSvg(roomPts, roomColor, "Room");

    var xAxisLabels = "", xTickCount = Math.min(maxDay, 6);
    for (var t = 0; t <= xTickCount; t++) {
      var dd = Math.round((t / xTickCount) * maxDay);
      xAxisLabels += '<text x="' + x(dd) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="var(--muted)">Day ' + dd + '</text>';
    }

    var legendItems = [];
    if (boxPts.length) legendItems.push('<span class="item"><span class="swatch" style="background:' + boxColor + '"></span>Box</span>');
    if (roomPts.length) legendItems.push('<span class="item"><span class="swatch" style="background:' + roomColor + '"></span>Room</span>');
    var legend = '<div class="legend">' + legendItems.join("") + '</div>';

    return '' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;" role="img" aria-label="' + label + ' over time">' +
      gridLines + baseline + seriesSvgStr + xAxisLabels +
    '</svg>' + legend;
  }

  /* ---------------- Events ---------------- */
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  function openOverlay(id) { var el = document.getElementById(id); if (el) el.hidden = false; }
  function closeOverlay(id) { var el = document.getElementById(id); if (el) el.hidden = true; }

  function bindListEvents() {
    var btnNew = document.getElementById("btnNewBatch");
    var btnNewCard = document.getElementById("btnNewBatchCard");
    if (btnNew) btnNew.addEventListener("click", function(){ openOverlay("newBatchOverlay"); });
    if (btnNewCard) btnNewCard.addEventListener("click", function(){ openOverlay("newBatchOverlay"); });

    var btnExample = document.getElementById("btnLoadExample");
    if (btnExample) btnExample.addEventListener("click", function() { loadExampleBatch(); render(); });

    document.querySelectorAll("[data-open]").forEach(function(el) {
      el.addEventListener("click", function() {
        state.selectedBatchId = el.getAttribute("data-open");
        state.view = "detail";
        render();
      });
    });

    var cancelBtn = document.getElementById("btnCancelNewBatch");
    if (cancelBtn) cancelBtn.addEventListener("click", function() { closeOverlay("newBatchOverlay"); });
    var overlay = document.getElementById("newBatchOverlay");
    if (overlay) overlay.addEventListener("click", function(e) { if (e.target === overlay) overlay.hidden = true; });

    var form = document.getElementById("newBatchForm");
    if (form) form.addEventListener("submit", function(e) {
      e.preventDefault();
      var fd = new FormData(form);
      var batchId = uid();
      var data = {
        id: batchId,
        name: fd.get("name").trim() || "Untitled batch",
        meatType: fd.get("meatType").trim(),
        cut: fd.get("cut").trim(),
        startDate: fd.get("startDate") || todayISO(),
        targetLossPct: Number(fd.get("targetLossPct")) || 40,
        dryingSetup: fd.get("dryingSetup"),
        fanSpeed: fd.get("fanSpeed") || "",
        ingredients: parseIngredientsFromForm(fd),
        methodNotes: fd.get("methodNotes").trim(),
        rating: null,
        createdAt: Date.now()
      };
      addBatch(data);
      parseStripRowsFromForm(fd).forEach(function(row) {
        if (!row.weightG) return;
        addStrip({ id: uid(), batchId: batchId, label: row.label, initialWeightG: row.weightG, thicknessMm: row.thicknessMm, addedDate: data.startDate, texture: null, createdAt: Date.now() });
      });
      state.selectedBatchId = batchId;
      state.view = "detail";
      render();
      toast("Batch created");
    });

    bindGlobalEvents();
  }

  function bindDetailEvents(b) {
    document.getElementById("btnBack").addEventListener("click", function() { state.view = "list"; state.selectedBatchId = null; render(); });

    document.querySelectorAll("[data-rate-batch]").forEach(function(el) {
      el.addEventListener("click", function() {
        var n = Number(el.getAttribute("data-rate-batch"));
        editBatch(b.id, { rating: n || null });
        render();
      });
    });

    var delBatchBtn = document.getElementById("btnDeleteBatch");
    if (delBatchBtn) delBatchBtn.addEventListener("click", function() {
      if (confirm('Delete "' + b.name + '" and all its strips/log entries? This cannot be undone (unless you have a backup).')) {
        deleteBatch(b.id);
        render();
        toast("Batch deleted");
      }
    });

    var editBtn = document.getElementById("btnEditBatch");
    if (editBtn) editBtn.addEventListener("click", function() { openOverlay("editBatchOverlay"); });
    var editOverlay = document.getElementById("editBatchOverlay");
    if (editOverlay) editOverlay.addEventListener("click", function(e) { if (e.target === editOverlay) editOverlay.hidden = true; });
    var editCancel = document.getElementById("btnCancelEditBatch");
    if (editCancel) editCancel.addEventListener("click", function() { closeOverlay("editBatchOverlay"); });
    var editForm = document.getElementById("editBatchForm");
    if (editForm) editForm.addEventListener("submit", function(e) {
      e.preventDefault();
      var fd = new FormData(editForm);
      editBatch(b.id, {
        name: fd.get("name").trim() || "Untitled batch",
        meatType: fd.get("meatType").trim(),
        cut: fd.get("cut").trim(),
        startDate: fd.get("startDate") || b.startDate,
        targetLossPct: Number(fd.get("targetLossPct")) || 40,
        dryingSetup: fd.get("dryingSetup"),
        fanSpeed: fd.get("fanSpeed") || "",
        ingredients: parseIngredientsFromForm(fd),
        methodNotes: fd.get("methodNotes").trim()
      });
      render();
      toast("Batch updated");
    });

    // Add strip
    var addStripBtn = document.getElementById("btnAddStrip");
    if (addStripBtn) addStripBtn.addEventListener("click", function() { openOverlay("addStripOverlay"); });
    var addStripOverlay = document.getElementById("addStripOverlay");
    if (addStripOverlay) addStripOverlay.addEventListener("click", function(e) { if (e.target === addStripOverlay) addStripOverlay.hidden = true; });
    var cancelAddStrip = document.getElementById("btnCancelAddStrip");
    if (cancelAddStrip) cancelAddStrip.addEventListener("click", function() { closeOverlay("addStripOverlay"); });
    var addStripForm = document.getElementById("addStripForm");
    if (addStripForm) addStripForm.addEventListener("submit", function(e) {
      e.preventDefault();
      var fd = new FormData(addStripForm);
      addStrip({
        id: uid(), batchId: b.id, label: fd.get("label").trim() || "Strip",
        initialWeightG: Number(fd.get("initialWeightG")), thicknessMm: fd.get("thicknessMm") ? Number(fd.get("thicknessMm")) : null,
        addedDate: fd.get("addedDate") || todayISO(), addedTime: fd.get("addedTime") || "", texture: null, createdAt: Date.now()
      });
      render();
      toast("Strip added");
    });

    // Edit / delete strip (delegated per-row buttons, rebuilt on every render so safe to bind directly)
    document.querySelectorAll("[data-edit-strip]").forEach(function(el) {
      el.addEventListener("click", function() {
        var stripId = el.getAttribute("data-edit-strip");
        var strip = state.strips.find(function(s){ return s.id === stripId; });
        if (!strip) return;
        var wrap = document.createElement("div");
        wrap.innerHTML = stripModal("edit", b, strip);
        document.body.appendChild(wrap.firstElementChild);
        openOverlay("editStripOverlay");
        document.getElementById("btnCancelEditStrip").addEventListener("click", function() {
          var ov = document.getElementById("editStripOverlay"); if (ov) ov.remove();
        });
        document.getElementById("editStripOverlay").addEventListener("click", function(e) {
          if (e.target.id === "editStripOverlay") e.target.remove();
        });
        document.getElementById("editStripForm").addEventListener("submit", function(e2) {
          e2.preventDefault();
          var fd2 = new FormData(e2.target);
          editStrip(stripId, {
            label: fd2.get("label").trim() || strip.label,
            initialWeightG: Number(fd2.get("initialWeightG")),
            thicknessMm: fd2.get("thicknessMm") ? Number(fd2.get("thicknessMm")) : null,
            addedDate: fd2.get("addedDate") || strip.addedDate,
            addedTime: fd2.get("addedTime") || "",
            texture: fd2.get("texture") || null
          });
          document.getElementById("editStripOverlay").remove();
          render();
          toast("Strip updated");
        });
      });
    });
    document.querySelectorAll("[data-del-strip]").forEach(function(el) {
      el.addEventListener("click", function() {
        var stripId = el.getAttribute("data-del-strip");
        var strip = state.strips.find(function(s){ return s.id === stripId; });
        if (strip && confirm('Delete "' + strip.label + '" and its weigh-in history?')) {
          deleteStrip(stripId);
          render();
          toast("Strip deleted");
        }
      });
    });

    // Daily update (environment + per-strip weights)
    var entryForm = document.getElementById("entryForm");
    if (entryForm) entryForm.addEventListener("submit", function(e) {
      e.preventDefault();
      var fd = new FormData(entryForm);
      var date = fd.get("date") || todayISO();
      var time = fd.get("time") || "";
      addDayLog({
        id: uid(), batchId: b.id, date: date, time: time,
        boxTempC: fd.get("boxTempC") ? Number(fd.get("boxTempC")) : "",
        boxHumidityPct: fd.get("boxHumidityPct") ? Number(fd.get("boxHumidityPct")) : "",
        roomTempC: fd.get("roomTempC") ? Number(fd.get("roomTempC")) : "",
        roomHumidityPct: fd.get("roomHumidityPct") ? Number(fd.get("roomHumidityPct")) : "",
        fanSpeed: fd.get("fanSpeed") || "",
        notes: fd.get("notes").trim(),
        createdAt: Date.now()
      });
      var addedAny = false;
      stripsFor(b.id).forEach(function(strip) {
        var val = fd.get("stripWeight_" + strip.id);
        if (val) {
          addStripWeight({ id: uid(), stripId: strip.id, batchId: b.id, date: date, time: time, weightG: Number(val), createdAt: Date.now() });
          addedAny = true;
        }
      });
      persist();
      render();
      toast(addedAny ? "Update saved" : "Reading saved");
    });

    document.querySelectorAll("[data-del-daylog]").forEach(function(el) {
      el.addEventListener("click", function() { deleteDayLog(el.getAttribute("data-del-daylog")); render(); });
    });
    document.querySelectorAll("[data-del-stripweight]").forEach(function(el) {
      el.addEventListener("click", function() { deleteStripWeight(el.getAttribute("data-del-stripweight")); render(); });
    });

    var toggleFitPerStrip = document.getElementById("toggleFitPerStrip");
    if (toggleFitPerStrip) toggleFitPerStrip.addEventListener("change", function() { chartShowPerStripFit = toggleFitPerStrip.checked; render(); });
    var toggleFitCombined = document.getElementById("toggleFitCombined");
    if (toggleFitCombined) toggleFitCombined.addEventListener("change", function() { chartShowCombinedFit = toggleFitCombined.checked; render(); });

    // hover tooltips for chart points
    var tip = document.getElementById("tooltip");
    document.querySelectorAll(".pt").forEach(function(el) {
      el.addEventListener("mousemove", function(ev) {
        tip.innerHTML = '<div class="d">' + esc(el.getAttribute("data-tip")) + '</div>';
        tip.style.display = "block";
        tip.style.left = (ev.clientX + 14) + "px";
        tip.style.top = (ev.clientY + 14) + "px";
      });
      el.addEventListener("mouseleave", function() { tip.style.display = "none"; });
    });

    bindGlobalEvents();
  }

  function bindGlobalEvents() {
    var dismiss = document.getElementById("btnDismissBanner");
    if (dismiss) dismiss.addEventListener("click", function() { state.bannerDismissed = true; render(); });

    if (firebaseConfigured() || fileHandle) {
      updateSyncIndicator();
      var backupBtn = document.getElementById("btnBackupCopy");
      if (backupBtn) backupBtn.addEventListener("click", exportData);
      if (firebaseConfigured()) {
        var signOutBtn = document.getElementById("btnSignOut");
        if (signOutBtn) signOutBtn.addEventListener("click", function() {
          if (confirm("Sign out of this tracker? You'll need to request a new email link to get back in.")) signOutUser();
        });
      }
    } else if (fsSupported) {
      var connExisting = document.getElementById("btnConnectExisting");
      var connNew = document.getElementById("btnConnectNew");
      if (connExisting) connExisting.addEventListener("click", connectExistingFile);
      if (connNew) connNew.addEventListener("click", connectNewFile);
    } else {
      var exportBtn = document.getElementById("btnExport");
      if (exportBtn) exportBtn.addEventListener("click", exportData);
    }

    // present whenever rendered (plain fallback UI, or the Firebase-error safety net)
    var fileImport = document.getElementById("fileImport");
    if (fileImport) fileImport.addEventListener("change", function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try { importData(JSON.parse(reader.result)); toast("Data imported"); }
        catch (err) { alert("Couldn't read that file — make sure it's a JSON export from this tracker."); }
        render();
      };
      reader.readAsText(file);
    });
  }

  function loadExampleBatch() {
    var start = new Date(); start.setDate(start.getDate() - 3);
    var startISO = start.toISOString().slice(0,10);
    var b = {
      id: uid(), name: "Example: Beef silverside", meatType: "Beef", cut: "Silverside",
      startDate: startISO, targetLossPct: 40, dryingSetup: "Biltong box (fan only)", fanSpeed: "Medium",
      ingredients: [
        { name: "Coarse black pepper", amount: "3 tbsp" },
        { name: "Coriander seed (toasted & crushed)", amount: "3 tbsp" },
        { name: "Salt", amount: "2% of meat weight" },
        { name: "Brown / spirit vinegar", amount: "quick dunk + spray" },
        { name: "Brown sugar", amount: "1 tbsp" }
      ],
      methodNotes: "24h fridge cure under weight, vinegar dunk before spicing.",
      createdAt: Date.now()
    };
    state.batches.unshift(b);

    var strips = [
      { label: "Strip 1 (thick end)", initialWeightG: 480, thicknessMm: 28 },
      { label: "Strip 2 (mid)", initialWeightG: 360, thicknessMm: 20 },
      { label: "Strip 3 (thin end)", initialWeightG: 240, thicknessMm: 14 }
    ];
    var stripIds = strips.map(function(s) {
      var id = uid();
      state.strips.push({ id: id, batchId: b.id, label: s.label, initialWeightG: s.initialWeightG, thicknessMm: s.thicknessMm, addedDate: startISO, createdAt: Date.now() });
      return { id: id, initial: s.initialWeightG };
    });

    var offsets = [0, 1, 2, 3];
    var temps = [21, 20.5, 21.5, 21];
    var hums = [48, 45, 42, 40];
    // Rough decelerating-loss curve per strip so the example looks realistic and thinner strips lead.
    var lossCurves = [
      [0, 6, 11.5, 16.5],   // thick strip — slower
      [0, 8, 15.5, 22],     // mid strip
      [0, 11, 20, 28]       // thin strip — faster
    ];
    offsets.forEach(function(off, i) {
      var d = new Date(start); d.setDate(d.getDate() + off);
      var dateISO = d.toISOString().slice(0,10);
      state.dayLogs.push({
        id: uid(), batchId: b.id, date: dateISO, boxTempC: temps[i], boxHumidityPct: hums[i],
        roomTempC: "", roomHumidityPct: "", fanSpeed: "Medium", notes: i === 0 ? "Hung up, starting weights taken" : "", createdAt: Date.now() + i
      });
      stripIds.forEach(function(sInfo, sIdx) {
        var lossPct = lossCurves[sIdx][i];
        var weight = Math.round(sInfo.initial * (1 - lossPct / 100));
        state.stripWeights.push({ id: uid(), stripId: sInfo.id, batchId: b.id, date: dateISO, weightG: weight, createdAt: Date.now() + i });
      });
    });
    persist();
  }

  // Delegated, bound once (not per-render) so dynamic rows in whichever modal is
  // currently open always work without stacking duplicate listeners.
  document.addEventListener("click", function(e) {
    var addIng = e.target.closest("[data-add-ing]");
    if (addIng) {
      var ingContainer = document.getElementById("ingredientRows");
      if (ingContainer) ingContainer.insertAdjacentHTML("beforeend", ingredientRowHTML("", ""));
      return;
    }
    var rmIng = e.target.closest("[data-remove-ing]");
    if (rmIng) { var ingRow = rmIng.closest(".row-item"); if (ingRow) ingRow.remove(); return; }

    var addStripRow = e.target.closest("[data-add-strip]");
    if (addStripRow) {
      var stripContainer = document.getElementById("stripRows");
      if (stripContainer) stripContainer.insertAdjacentHTML("beforeend", stripRowHTML("", null, null));
      return;
    }
    var rmStripRow = e.target.closest("[data-remove-strip]");
    if (rmStripRow) { var stripRow = rmStripRow.closest(".row-item"); if (stripRow) stripRow.remove(); return; }
  });

  // Live countdown: ticks any [data-countdown] element currently in the DOM
  // (strip "est. ready" cells) without re-rendering the whole app each second.
  setInterval(function() {
    var now = Date.now();
    document.querySelectorAll("[data-countdown]").forEach(function(el) {
      el.textContent = formatCountdown(Number(el.getAttribute("data-countdown")) - now);
    });
  }, 1000);

  render();
  initFirebase().catch(function(err) { console.error(err); });
})();
</script>
